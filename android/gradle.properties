# Project-wide Gradle settings — DO NOT EDIT unless you know what you're doing.

# AndroidX + Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# R8 full mode for aggressive shrinking in release
android.enableR8.fullMode=true

# Gradle JVM args — increase heap for large projects
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Parallel builds
org.gradle.parallel=true

# Gradle configuration cache (speeds up builds)
org.gradle.configuration-cache=false

# Non-transitive R classes (recommended by Google)
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Explicit JDK 17 location for Gradle build compatibility
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.20.8-hotspot

