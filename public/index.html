<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Ultra Administrador — Sistema SaaS Multi-Tenant desarrollado por ProLine System. Todos los derechos reservados.">
  <meta name="author" content="ProLine System">
  <meta name="theme-color" content="#0a0a0b">
  <title>Ultra Administrador — ProLine System</title>
  
  <!-- Favicon & PWA Manifest -->
  <link rel="icon" href="/assets/logo_ultra_administrador.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/logo_ultra_administrador.png">
  
  <!-- Typography (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- File Processing & Export CDNs (SheetJS, Mammoth, PDF.js, jsPDF, Tesseract OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (typeof window !== 'undefined' && window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  
  <!-- Import Map for Native ES Modules -->
  <script type="importmap">
  {
    "imports": {
      "gsap": "https://esm.sh/gsap@3.12.5",
      "lenis": "https://esm.sh/lenis@1.1.18",
      "three": "https://esm.sh/three@0.160.0",
      "motion": "https://esm.sh/motion@11.11.17"
    }
  }
  </script>

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: {
              primary: 'var(--color-bg-primary)',
              secondary: 'var(--color-bg-secondary)',
              tertiary: 'var(--color-bg-tertiary)'
            },
            surface: {
              DEFAULT: 'var(--color-surface)',
              hover: 'var(--color-surface-hover)'
            },
            accent: {
              DEFAULT: 'var(--color-accent)',
              hover: 'var(--color-accent-hover)',
              light: 'var(--color-accent-light)'
            },
            text: {
              primary: 'var(--color-text-primary)',
              secondary: 'var(--color-text-secondary)',
              tertiary: 'var(--color-text-tertiary)'
            },
            success: 'var(--color-success)',
            warning: 'var(--color-warning)',
            danger: 'var(--color-danger)',
            info: 'var(--color-info)'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>
  
  <!-- CSS Stylesheet Entrypoint -->
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="theme-dark">
  <!-- Application Root -->
  <div id="app" class="app-container"></div>
  
  <!-- Instant Initial Loader (renders immediately before JS executes) -->
  <div id="app-loader" style="
    position: fixed; inset: 0;
    background: #0a0a0b;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; z-index: 9999;
    color: #f8fafc;
    font-family: 'Inter', sans-serif;
  ">
    <img src="/assets/logo_ultra_administrador.png" 
         alt="Ultra Administrador" 
         onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='assets/logo_ultra_administrador.png';}else if(this.dataset.tried==='1'){this.dataset.tried='2';this.src='logo_ultra_administrador.png';}else if(this.dataset.tried==='2'){this.dataset.tried='3';this.src='./assets/logo_ultra_administrador.png';}" 
         style="width: 76px; height: 76px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(139,92,246,0.35)); margin-bottom: 8px;" />
    <div style="
      width: 44px; height: 44px;
      border: 3px solid rgba(139,92,246,0.25);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    "></div>
    <div style="text-align: center;">
      <p style="font-size: 1rem; font-weight: 700; color: #fff; margin: 0 0 2px;">Ultra Administrador</p>
      <p style="font-size: 0.75rem; color: rgba(255,255,255,0.45); margin: 0;">Un producto de ProLine System</p>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>

  <!-- Application Bootstrap -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
